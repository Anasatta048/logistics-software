# Self-hosted stack: app + MySQL.
#   cp .env.docker.example .env   (fill in APP_KEY, passwords, admin)
#   docker compose up -d --build
# For Coolify, deploy the Dockerfile directly and set the same variables in its UI.
services:
  app:
    build: .
    image: dreamelect-logistics:latest
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: 3306
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - storage:/var/www/storage
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  storage:
  dbdata:
