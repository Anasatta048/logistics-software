<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1B2A4A">
<title>You are offline</title>
<style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #1B2A4A; color: #fff; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; text-align: center; padding: 24px; }
    .box { max-width: 360px; }
    h1 { font-size: 22px; margin: 18px 0 8px; }
    p { color: rgba(255, 255, 255, .7); line-height: 1.5; margin: 0 0 24px; }
    button { background: #E8622C; color: #fff; border: 0; padding: 12px 24px; font-size: 15px; font-weight: 700; cursor: pointer; }
    .bar { height: 3px; background: #E8622C; width: 56px; margin: 0 auto; }
</style>
</head>
<body>
<div class="box">
    <div class="bar"></div>
    <h1>You are offline</h1>
    <p>The app needs an internet connection to load your latest loads and figures. Check your connection and try again.</p>
    <button onclick="location.reload()">Try again</button>
</div>
</body>
</html>
